apiVersion: batch/v1
kind: Job
metadata:
  name: aihub-crawler-learn-001
  namespace: aihub-poc
  labels:
    app: aihub-crawler
    purpose: smoke-test
    target: learn-liferay
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: aihub-crawler
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: crawler
          image: europe-west3-docker.pkg.dev/ai-hub-liferay/ai-hub/aihub-crawler:v1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: CRAWLER_DOMAIN_URL
              value: "https://learn.liferay.com"
            - name: CRAWLER_SEED_URL
              value: "https://learn.liferay.com"
            - name: CRAWLER_OUTPUT_INDEX
              value: "aihub-learn"
            - name: ELASTICSEARCH_HOST
              value: "elasticsearch.aihub-poc.svc.cluster.local"
            - name: ELASTICSEARCH_PORT
              value: "9200"
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
