{{- if and .Values.enabled .Values.serviceAccount.create -}}
{{- $gsa := .Values.serviceAccount.gcpServiceAccount -}}
apiVersion: v1
kind: ServiceAccount
metadata:
    annotations:
        {{- if $gsa }}
        iam.gke.io/gcp-service-account: {{ $gsa | quote }}
        {{- end }}
        {{- with .Values.serviceAccount.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    labels:
        {{- include "sharedLabels" . | nindent 8 }}
    name: {{ include "serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if $gsa }}
---
apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
kind: ServiceAccountIAMMember
metadata:
    labels:
        {{- include "sharedLabels" . | nindent 8 }}
    name: {{ printf "%s-workload-identity" (include "serviceAccountName" .) }}
    namespace: {{ .Release.Namespace }}
spec:
    forProvider:
        member: {{ printf "serviceAccount:%s.svc.id.goog[%s/%s]" (required "serviceAccount.gcpServiceAccount is set but no cloud project can be derived — set values.cloudProjectId" .Values.cloudProjectId) .Release.Namespace (include "serviceAccountName" .) | quote }}
        role: roles/iam.workloadIdentityUser
        serviceAccount: {{ printf "projects/-/serviceAccounts/%s" $gsa | quote }}
{{- end }}
{{- end -}}