{{- /*
LCI-ROLLOUT: SCOPE=ENV_SCOPED_MEDIUM
Introduced by LCI-5246. HealthCheckPolicy supplies the GKE L7 LB with the
correct HTTP healthcheck path (/c/portal/robots by default). Liferay returns
200 only after the portal is up — using the default LB TCP check would mark
backends ready before the portal is actually serving.
Rollout: enable in dev first, confirm LB marks backends Healthy only after
portal boot. If a prd env flips gke.enabled=true without this template
being present, LB will fall back to TCP checks and send 503s to users
during roll restarts. uat/prd after dev soak.
*/ -}}
{{- if .Values.network.gke.enabled }}
{{- $probePort := .Values.readinessProbe.httpGet.port -}}
{{- range .Values.ports -}}
    {{- if eq .name $probePort -}}{{- $probePort = .containerPort -}}{{- end -}}
{{- end -}}
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
    labels:
        app: {{ include "liferay.name" . }}
        {{- include "liferay.labels" . | nindent 8 }}
    name: {{ include "liferay.name" . }}
    namespace: {{ include "liferay.namespace" . }}
spec:
    default:
        checkIntervalSec: {{ dig "healthCheck" "checkIntervalSec" 15 .Values.network.gke }}
        timeoutSec: {{ dig "healthCheck" "timeoutSec" 5 .Values.network.gke }}
        config:
            type: HTTP
            httpHealthCheck:
                port: {{ $probePort }}
                requestPath: {{ .Values.readinessProbe.httpGet.path }}
    targetRef:
        group: ""
        kind: Service
        name: {{ include "liferay.name" . }}
{{- end }}