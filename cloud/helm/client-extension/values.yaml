clientExtension:
    configs: {}
    domain: ""
    dxpNamespace: ""
    serviceId: ""
    version: ""
    virtualInstanceId: liferay.com
descriptor: {}
fullnameOverride: ""
image:
    pullPolicy: IfNotPresent
    repository: ""
    tag: ""
imagePullSecrets: []
labels: {}
nameOverride: ""
network:
    enabled: false
    endpointRef: http
    gatewayName: ""
    gatewayNamespace: ""
    # LCI-ROLLOUT: SCOPE=ENV_SCOPED_LOW
    # LCI-5403. Opt-in flag for GKE L7 integration. When true, this chart
    # emits an NP ingress rule that whitelists the GKE LB healthcheck
    # source ranges on the Service port. Leave false when the install
    # does not front client-extension workloads with the GKE L7 LB.
    gke:
        enabled: false
    hostnames: []
operatorServiceAccount:
    name: dxp-operator
    namespace: dxp-operator-system
podAnnotations: {}
podLabels: {}
service:
    enabled: null
    port: 80
    type: ClusterIP
serviceAccount:
    annotations: {}
    create: false
    name: ""
workload:
    affinity: {}
    backoffLimit: 6
    containerPort: 80
    enabled: null
    env: {}
    kind: ""
    livenessProbe: {}
    nodeSelector: {}
    podSecurityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
            type: RuntimeDefault
        sysctls:
            -   name: net.ipv4.ip_unprivileged_port_start
                value: "0"
    readinessProbe: {}
    replicas: 1
    resources: {}
    schedule: ""
    securityContext:
        allowPrivilegeEscalation: false
        capabilities:
            add:
                -   NET_BIND_SERVICE
            drop:
                -   ALL
    startupProbe: {}
    tolerations: []
    volumeMounts: []
    volumes: []