{{- $search := .Values.search.elasticsearch -}}
{{- if and .Values.enabled $search.enabled $search.exporter.enabled -}}
{{- $exp := $search.exporter -}}
{{- $elasticsearchNamespace := printf "%s-elasticsearch" .Release.Namespace -}}
{{- $esName := include "elasticsearch.name" . -}}
{{- $name := printf "%s-exporter" $esName -}}
apiVersion: apps/v1
kind: Deployment
metadata:
    labels:
        app.kubernetes.io/component: metrics
        app.kubernetes.io/name: elasticsearch-exporter
        projectId: {{ .Values.projectId }}
    name: {{ $name }}
    namespace: {{ $elasticsearchNamespace }}
spec:
    replicas: {{ $exp.replicaCount }}
    selector:
        matchLabels:
            app.kubernetes.io/name: elasticsearch-exporter
    template:
        metadata:
            labels:
                app.kubernetes.io/component: metrics
                app.kubernetes.io/name: elasticsearch-exporter
                projectId: {{ .Values.projectId }}
        spec:
            automountServiceAccountToken: false
            containers:
                -   args:
                        -   --es.uri=http://{{ $esName }}-es-http:9200
                        -   --es.all
                        -   --es.indices
                        -   --es.indices_settings
                        -   --es.shards
                        -   --collector.clustersettings
                        -   --collector.snapshots
                        -   --collector.slm
                        -   --es.timeout=20s
                        -   --web.listen-address=:9114
                        -   --web.telemetry-path=/metrics
                        -   --log.format=json
                    env:
                        -   name: ES_USERNAME
                            value: elastic
                        -   name: ES_PASSWORD
                            valueFrom:
                                secretKeyRef:
                                    key: elastic
                                    name: {{ $esName }}-es-elastic-user
                    image: {{ printf "%s:%s" $exp.image.repository ($exp.image.tag | toString) }}
                    imagePullPolicy: {{ $exp.image.pullPolicy }}
                    livenessProbe:
                        {{- toYaml $exp.livenessProbe | nindent 24 }}
                    name: exporter
                    ports:
                        {{- toYaml $exp.ports | nindent 24 }}
                    readinessProbe:
                        {{- toYaml $exp.readinessProbe | nindent 24 }}
                    resources:
                        {{- toYaml $exp.resources | nindent 24 }}
                    securityContext:
                        allowPrivilegeEscalation: false
                        capabilities:
                            drop:
                                -   ALL
                        readOnlyRootFilesystem: true
            securityContext:
                fsGroup: 65534
                runAsGroup: 65534
                runAsNonRoot: true
                runAsUser: 65534
                seccompProfile:
                    type: RuntimeDefault
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    labels:
        app.kubernetes.io/component: metrics
        app.kubernetes.io/name: elasticsearch-exporter
        projectId: {{ .Values.projectId }}
    name: {{ $name }}
    namespace: {{ $elasticsearchNamespace }}
spec:
    ingress:
        -   from:
                -   namespaceSelector:
                        matchLabels:
                            kubernetes.io/metadata.name: gmp-system
                    podSelector:
                        matchLabels:
                            app: managed-prometheus-collector
                            app.kubernetes.io/name: collector
            ports:
                -   port: metrics
                    protocol: TCP
    podSelector:
        matchLabels:
            app.kubernetes.io/name: elasticsearch-exporter
    policyTypes:
        -   Ingress
{{- end -}}